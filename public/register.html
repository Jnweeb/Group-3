<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Group 3 - Register</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Group 3</h1>

            <p class="subtitle">
                Student Management System
            </p>

            <h2>Create Student Account</h2>

            <form id="registerForm">

                <div class="form-group">
                    <label for="studentNumber">
                        Student Number
                    </label>

                    <input
                        type="text"
                        id="studentNumber"
                        placeholder="e.g. 23-123456"
                        pattern="[0-9]{2}-[0-9]{6}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter your age"
                        min="1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">
                        Course
                    </label>

                    <input
                        type="text"
                        id="course"
                        placeholder="e.g. BS Computer Science"
                        required
                    >
                </div>

                <button type="submit">
                    Register
                </button>

                <p id="message"></p>

            </form>

            <p class="register-link">
                Already have an account?
                <a href="/">Login</a>
            </p>

        </div>

    </div>

    <script src="/js/register.js"></script>

</body>
</html>
